<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0f19" />
  <title>Fat Loss Coach</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="app">
    <h1>Fat Loss Coach</h1>

    <section class="card">
      <h2>1-Tap Daily Log</h2>
      <div class="grid2">
        <label>Date <input id="date" type="date" /></label>
        <label>Weight (kg) <input id="weight" type="number" step="0.1" /></label>
        <label>Calories <input id="calories" type="number" value="1800" /></label>
        <label>Protein (g) <input id="protein" type="number" value="130" /></label>
      </div>
      <label><input id="workout" type="checkbox" /> Workout done</label>
      <label>Consistency score <input id="consistency" type="range" min="0" max="100" value="80" /></label>
      <textarea id="notes" rows="2" placeholder="Random thought / mood"></textarea>
      <button id="logToday">Log Today</button>
      <p id="logMsg"></p>
    </section>

    <section class="card">
      <h2>Quick Meal</h2>
      <div class="grid2">
        <input id="mealName" placeholder="Paneer bhurji" />
        <input id="mealCals" type="number" placeholder="Calories" />
        <input id="mealProtein" type="number" placeholder="Protein" />
      </div>
      <button id="logMeal">Add Meal</button>
    </section>

    <section class="card">
      <h2>Photo + Notes</h2>
      <input id="photo" type="file" accept="image/*" capture="environment" />
      <input id="caption" placeholder="Caption" />
      <button id="uploadPhoto">Upload Photo</button>
      <button id="logThought">Save Thought</button>
      <img id="montage" alt="montage preview" />
    </section>

    <section class="card">
      <h2>Milestone (30 days)</h2>
      <pre id="milestone"></pre>
      <button id="refreshMilestone">Refresh</button>
      <a class="button" href="/api/export">Download ZIP/JSON Export</a>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
